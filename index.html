<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mock Test Quiz</title>
  <!-- Apply saved theme before first paint (prevents a white flash in dark mode) -->
  <script>
    try {
      var t = localStorage.getItem('wcmt_theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="topbar-row">
      <button class="brand" data-act="tab" data-v="home" id="brand">Mock Tests</button>
      <button class="btn icon" data-act="toggleTheme" id="themeBtn" aria-label="Switch light / dark mode"></button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Main"></nav>
  </header>

  <main id="app"></main>
  <div id="modal"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- data.js = your questions (edit this).  app.js = the quiz engine (no need to edit). -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
